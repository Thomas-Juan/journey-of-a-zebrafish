<!-- Loading screen for the browser version. tools/publish.py (web) inserts this file right after
     <body> in the page pygbag builds. It covers pygbag's own messages, follows them (#progress,
     #infobox), and fades out when the game starts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { background: #0f3a44 !important; }
  #infobox, #transfer { opacity: 0 !important; pointer-events: none !important; }

  #game-loader {
    --ink: #1f1b33; --cream: #fffdf8; --sand: #f2cc92; --coral: #e0613f; --coral-dark: #c24e2f;
    position: fixed; inset: 0; z-index: 1000000; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #8ecfc9 0%, #2a9d99 42%, #1c6f73 78%, #134e55 100%);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--cream);
    transition: opacity .6s ease;
    cursor: default;
  }
  #game-loader.done { opacity: 0; pointer-events: none; }
  #game-loader::before {                     /* light from the surface */
    content: ""; position: absolute; inset: -10% -30%;
    background: repeating-linear-gradient(100deg, transparent 0 110px, rgb(255 255 240 / .07) 110px 170px, transparent 170px 260px);
    pointer-events: none;
  }
  #game-loader .floor {                      /* sand, with an ink edge */
    position: absolute; left: -5%; right: -5%; bottom: -6vh; height: 16vh;
    background: var(--sand); border-top: 3px solid var(--ink);
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  }
  #game-loader .card { position: relative; text-align: center; padding: 0 16px; max-width: 620px; }
  #game-loader .fish { width: min(260px, 52vw); height: auto; display: block; margin: 0 auto 10px; overflow: visible;
    animation: zf-bob 2.8s ease-in-out infinite alternate; }
  #game-loader .tail { transform-box: view-box; transform-origin: 60px 50px; animation: zf-wag .42s ease-in-out infinite alternate; }
  #game-loader h1 { font-family: 'Inter Tight', Inter, system-ui, sans-serif; font-weight: 600;
    font-size: clamp(28px, 5.2vw, 46px); line-height: 1.1; letter-spacing: -.01em; margin: 0 0 8px;
    text-shadow: 0 2px 0 rgb(31 27 51 / .35); }
  #game-loader .sub { font-size: clamp(14px, 1.9vw, 17px); margin: 0 0 26px; opacity: .92; }
  #game-loader .bar { width: min(340px, 72vw); height: 12px; margin: 0 auto 12px; border-radius: 999px;
    border: 2px solid var(--ink); background: rgb(255 253 248 / .3); overflow: hidden; }
  #game-loader .bar i { display: block; height: 100%; width: 4%; background: var(--coral); border-radius: 999px;
    transition: width .35s ease; }
  #game-loader .status { font-size: 15px; font-weight: 500; min-height: 1.4em; margin: 0; }
  #game-loader button { margin-top: 14px; font: 600 17px Inter, system-ui, sans-serif; color: var(--cream);
    background: var(--coral); border: 2px solid var(--ink); border-radius: 999px; padding: 10px 30px;
    box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
  #game-loader button:hover { background: var(--coral-dark); }
  #game-loader button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  #game-loader .hint { font-size: 13px; line-height: 1.55; margin: 26px 0 0; opacity: .82; }
  #game-loader .bubble { position: absolute; bottom: -20px; border-radius: 50%;
    border: 1.5px solid rgb(255 255 255 / .75); background: rgb(255 255 255 / .12);
    animation: zf-rise linear infinite; }
  @keyframes zf-bob { from { transform: translateY(-5px) rotate(-1.5deg); } to { transform: translateY(5px) rotate(1.5deg); } }
  @keyframes zf-wag { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  @keyframes zf-rise { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } to { transform: translateY(-110vh); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) {
    #game-loader .fish, #game-loader .tail, #game-loader .bubble { animation: none; }
    #game-loader .bubble { display: none; }
  }
</style>

<div id="game-loader" role="status" aria-live="polite">
  <div class="floor"></div>
  <div class="card">
    <svg class="fish" viewBox="0 0 200 100" aria-hidden="true">
      <defs>
        <clipPath id="zf-body"><path d="M56 43 C80 30 110 22 140 24 C172 26 192 38 194 50 C192 63 172 75 140 77 C108 79 80 70 56 57 Z"/></clipPath>
        <clipPath id="zf-tailclip"><path d="M64 44 L14 18 Q24 36 36 50 Q24 64 14 82 L64 56 Z"/></clipPath>
        <clipPath id="zf-anal"><path d="M86 69 L78 90 L120 91 L124 74 Z"/></clipPath>
      </defs>
      <g class="tail">
        <path d="M64 44 L14 18 Q24 36 36 50 Q24 64 14 82 L64 56 Z" fill="#f4e2aa"/>
        <g clip-path="url(#zf-tailclip)" stroke="#2c4796" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M62 47 L16 30"/><path d="M62 53 L16 70"/>
        </g>
        <path d="M64 44 L14 18 Q24 36 36 50 Q24 64 14 82 L64 56 Z" fill="none" stroke="#1f1b33" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <path d="M100 27 L92 8 L122 13 L132 26 Z" fill="#f4e2aa" stroke="#1f1b33" stroke-width="3" stroke-linejoin="round"/>
      <path d="M86 69 L78 90 L120 91 L124 74 Z" fill="#f4e2aa"/>
      <g clip-path="url(#zf-anal)" stroke="#2c4796" stroke-width="4" fill="none"><path d="M82 77 L123 80"/><path d="M80 85 L121 87"/></g>
      <path d="M86 69 L78 90 L120 91 L124 74" fill="none" stroke="#1f1b33" stroke-width="3" stroke-linejoin="round"/>
      <path d="M56 43 C80 30 110 22 140 24 C172 26 192 38 194 50 C192 63 172 75 140 77 C108 79 80 70 56 57 Z" fill="#e6d49c"/>
      <g clip-path="url(#zf-body)">
        <path d="M40 0 H200 V35 C160 30 100 31 40 42 Z" fill="#70684a" opacity=".72"/>
        <path d="M40 100 H200 V68 C160 76 100 76 40 62 Z" fill="#f7f4e6"/>
        <g stroke="#24388c" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M50 45 C90 37 130 36 160 38"/>
          <path d="M50 50 C90 50 130 50 163 50"/>
          <path d="M50 55 C90 63 130 64 158 62"/>
        </g>
        <path d="M86 70 C110 73 130 73 146 71" stroke="#24388c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M80 33 C110 26 140 26 168 32" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M168 33 Q159 50 168 67" stroke="#8a7a4c" stroke-width="2" fill="none"/>
      </g>
      <path d="M56 43 C80 30 110 22 140 24 C172 26 192 38 194 50 C192 63 172 75 140 77 C108 79 80 70 56 57 Z" fill="none" stroke="#1f1b33" stroke-width="3"/>
      <path d="M152 60 L134 76 L146 60 Z" fill="#f4e2aa" stroke="#1f1b33" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="177" cy="44" r="7.5" fill="#dcb44a" stroke="#1f1b33" stroke-width="2"/>
      <circle cx="178" cy="44" r="4.4" fill="#12141e"/>
      <circle cx="175.6" cy="41.4" r="1.7" fill="#fff"/>
      <path d="M187 57 L193 53.5" stroke="#1f1b33" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Journey of a Zebrafish</h1>
    <p class="sub">From the rivers of India to the frontiers of biomedical research</p>
    <div class="bar"><i></i></div>
    <p class="status">Loading the game</p>
    <button type="button" hidden>Start</button>
    <p class="hint">The first visit takes longest: Python itself loads in your browser.<br>Arrow keys to swim, Space to dash.</p>
  </div>
</div>

<script>
(function () {
  var loader = document.getElementById('game-loader');
  if (!loader) return;
  var bar = loader.querySelector('.bar i'), status = loader.querySelector('.status'),
      start = loader.querySelector('button'), shown = 4, floor = 4, finished = false;

  for (var i = 0; i < 14; i++) {            // a few bubbles rising through the water
    var b = document.createElement('span'), d = 4 + Math.random() * 12;
    b.className = 'bubble';
    b.style.width = b.style.height = d + 'px';
    b.style.left = (Math.random() * 100) + '%';
    b.style.animationDuration = (7 + Math.random() * 9) + 's';
    b.style.animationDelay = (-Math.random() * 14) + 's';
    loader.appendChild(b);
  }

  function focusGame() {
    var c = document.getElementById('canvas');
    if (c) c.focus();
  }

  function finish() {
    if (finished) return;
    finished = true;
    bar.style.width = '100%';
    loader.classList.add('done');
    focusGame();
    setTimeout(function () { loader.remove(); }, 700);
  }

  function update() {
    var box = document.getElementById('infobox'), prog = document.getElementById('progress');
    if (!box) return;
    if (box.style.display === 'none') { finish(); return; }
    var t = (box.innerText || '').trim();
    if (/^installing/i.test(t)) {
      floor = Math.max(floor, 72);
      status.textContent = 'Installing ' + t.replace(/^installing\s*/i, '');
    } else if (/ready to start/i.test(t)) {
      floor = 100;
      status.textContent = 'Ready';
      start.hidden = false;
    } else if (shown > 60) {
      status.textContent = 'Unpacking the game';
    }
    var downloaded = prog && prog.value ? Math.min(100, prog.value) * 0.6 : 0;   // downloads are the first 60 %
    var target = Math.max(floor, downloaded);
    if (target < 100) target = Math.max(target, Math.min(shown + 0.25, 94));    // keep moving while Python starts
    shown = Math.max(shown, target);
    bar.style.width = shown + '%';
  }

  loader.addEventListener('click', focusGame);     // a click anywhere also unlocks the sound
  start.addEventListener('click', function () {
    start.hidden = true;
    status.textContent = 'Starting';
    focusGame();
  });
  var timer = setInterval(function () { update(); if (finished) clearInterval(timer); }, 150);
})();
</script>
